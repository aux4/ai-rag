name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - uses: aux4/action@v1
        with:
          command: lint
          strict: 'true'

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # faiss-node (package/lib runtime dep) compiles from source when its prebuilt binary
      # can't be downloaded or doesn't match the runner's Node ABI; that build needs BLAS/LAPACK.
      - name: Install BLAS/LAPACK for faiss-node
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libopenblas-dev liblapack-dev
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install
      # Rollup-bundles the CLI and the programmatic API to package/lib, then installs
      # faiss-node (the only native runtime dependency) into package/lib/node_modules.
      - run: npm run build
      - uses: aux4/action@v1
        with:
          command: lint
      - uses: aux4/action@v1
        with:
          command: test
          test_directory: test
      - name: Verify clean package bootstrap and JSON output
        run: node scripts/test-clean-runtime.mjs

  test-macos:
    needs: [lint]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - uses: aux4/action@v1
        with:
          command: lint
      - uses: aux4/action@v1
        with:
          command: test
          test_directory: test
      - name: Verify clean package bootstrap and JSON output
        run: node scripts/test-clean-runtime.mjs
