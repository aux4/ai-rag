# main -> prod hub (token minted from AUX4_PUBLISHER_* client credentials against prod SSO)
# dev  -> dev hub  (token minted from AUX4_DEV_PUBLISHER_* client credentials against dev SSO;
#         registry pointed at the dev hub). Both call aux4/action@v1 command:publish.
name: Publish Package

on:
  push:
    branches:
      - main
      - dev
    paths:
      - '**'
      - '!.github/**'
      - '!README.md'
      - '!LICENSE'
      - '!.gitignore'
  workflow_dispatch:
    inputs:
      level:
        description: Release level (patch, minor, major)
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: publish-package-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # faiss-node (package/lib runtime dep) compiles from source when its prebuilt binary can't
      # be downloaded (GitHub release assets) or doesn't match the runner's Node ABI; that build
      # needs BLAS/LAPACK.
      - name: Install BLAS/LAPACK for faiss-node
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libopenblas-dev liblapack-dev

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - uses: aux4/action@v1
        with:
          command: lint
          strict: 'true'
      - name: Install test runtime dependencies for this runner
        run: npm ci --prefix package/lib
      - uses: aux4/action@v1
        with:
          command: test
          test_directory: test
      - name: Verify clean package bootstrap and JSON output
        run: node scripts/test-clean-runtime.mjs

      - name: Mint production hub token
        id: token
        if: github.ref_name == 'main'
        env:
          CLIENT_ID: ${{ secrets.AUX4_PUBLISHER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AUX4_PUBLISHER_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -sf -u "$CLIENT_ID:$CLIENT_SECRET" \
            -d grant_type=client_credentials \
            "https://sso.aux4.io/token" | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::Could not mint a production hub publish token. Check AUX4_PUBLISHER_CLIENT_ID/SECRET."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # The dev hub is validated by dev SSO, so a prod token is rejected there.
      - name: Mint dev hub token
        id: devtoken
        if: github.ref_name == 'dev'
        env:
          CLIENT_ID: ${{ secrets.AUX4_DEV_PUBLISHER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AUX4_DEV_PUBLISHER_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -sf -u "$CLIENT_ID:$CLIENT_SECRET" \
            -d grant_type=client_credentials \
            "https://dev.sso.aux4.io/token" | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::Could not mint a dev hub publish token. Check AUX4_DEV_PUBLISHER_CLIENT_ID/SECRET."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Reset validation-generated working tree changes
        run: git restore --worktree .

      - uses: aux4/action@v1
        with:
          command: publish
          level: ${{ inputs.level || 'patch' }}
          # dev -> minted dev token + dev hub registry; main -> minted prod token + default (prod) hub
          registry: ${{ github.ref_name == 'dev' && 'https://dev.api.hub.aux4.io/v1/packages' || 'https://api.hub.aux4.io/v1/packages' }}
          aux4_token: ${{ github.ref_name == 'dev' && steps.devtoken.outputs.token || steps.token.outputs.token }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
