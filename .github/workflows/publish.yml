name: Publish to Production Hub

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!.github/**'
      - '!README.md'
      - '!LICENSE'
      - '!.gitignore'
  workflow_dispatch:
    inputs:
      level:
        description: Release level (patch, minor, major)
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: publish-package
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - uses: aux4/action@v1
        with:
          command: lint
          strict: 'true'
      - name: Install test runtime dependencies for this runner
        run: npm ci --prefix package/lib
      - uses: aux4/action@v1
        with:
          command: test
          test_directory: test
      - name: Verify clean package bootstrap and JSON output
        run: node scripts/test-clean-runtime.mjs
      - name: Mint production hub token
        id: token
        env:
          CLIENT_ID: ${{ secrets.AUX4_PUBLISHER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AUX4_PUBLISHER_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -sf -u "$CLIENT_ID:$CLIENT_SECRET" \
            -d grant_type=client_credentials \
            "https://sso.aux4.io/token" | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::Could not mint a production hub publish token. Check AUX4_PUBLISHER_CLIENT_ID/SECRET."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Reset validation-generated working tree changes
        run: git restore --worktree .
      - uses: aux4/action@v1
        with:
          command: publish
          level: ${{ inputs.level || 'patch' }}
          registry: https://api.hub.aux4.io/v1/packages
          aux4_token: ${{ steps.token.outputs.token }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
